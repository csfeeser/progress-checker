<title>Student Status</title>
<style>
  :root {
    color-scheme: light;
    --working: #2563eb;
    --good: #16a34a;
    --away: #6b7280;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 24px;
  }
  [hidden] { display: none !important; }

  /* Name form */
  #name-form input {
    width: 100%;
    font-size: 1.1rem;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    margin-bottom: 16px;
  }
  #name-form button {
    width: 100%;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--working);
    color: white;
    cursor: pointer;
  }
  #name-form button:active { opacity: 0.85; }
  .error {
    color: #b91c1c;
    margin-bottom: 12px;
    min-height: 1.2em;
    font-size: 0.95rem;
  }

  /* Status view */
  .student-name {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 8px;
  }
  .status-badge {
    display: inline-block;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    color: white;
    margin-bottom: 28px;
  }
  .status-badge.working { background: var(--working); }
  .status-badge.good { background: var(--good); }
  .status-badge.away { background: var(--away); }

  .status-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .status-btn {
    font-size: 1.15rem;
    font-weight: 600;
    padding: 20px;
    border-radius: 14px;
    border: 3px solid transparent;
    cursor: pointer;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .status-btn.working { background: var(--working); }
  .status-btn.good { background: var(--good); }
  .status-btn.away { background: var(--away); }
  .status-btn.selected { border-color: #111827; }
  .status-btn:active { opacity: 0.85; }
</style>

<div class="card">
  <div id="name-form">
    <h1>What's your name?</h1>
    <div class="error" id="name-error"></div>
    <input id="name-input" type="text" maxlength="50" placeholder="Your name" autocomplete="name" />
    <button id="join-btn">Join</button>
  </div>

  <div id="status-view" hidden>
    <h1>Student Status</h1>
    <div class="student-name" id="student-name"></div>
    <div class="status-badge" id="status-badge"></div>
    <div class="error" id="status-error"></div>
    <div class="status-buttons">
      <button class="status-btn working" data-status="working">🔵 Working</button>
      <button class="status-btn good" data-status="good">🟢 Good to Go</button>
      <button class="status-btn away" data-status="away">👻 Away</button>
    </div>
  </div>
</div>

<script>
  const STATUS_META = {
    working: { emoji: "🔵", label: "WORKING" },
    good: { emoji: "🟢", label: "GOOD TO GO" },
    away: { emoji: "👻", label: "AWAY" },
  };

  const nameForm = document.getElementById("name-form");
  const statusView = document.getElementById("status-view");
  const nameInput = document.getElementById("name-input");
  const joinBtn = document.getElementById("join-btn");
  const nameError = document.getElementById("name-error");
  const statusError = document.getElementById("status-error");
  const studentNameEl = document.getElementById("student-name");
  const statusBadge = document.getElementById("status-badge");

  function showNameForm() {
    statusView.hidden = true;
    nameForm.hidden = false;
    nameInput.focus();
  }

  function showStatusView(student) {
    nameForm.hidden = true;
    statusView.hidden = false;
    render(student);
  }

  function render(student) {
    studentNameEl.textContent = student.name;
    const meta = STATUS_META[student.status];
    statusBadge.textContent = `${meta.emoji} ${meta.label}`;
    statusBadge.className = `status-badge ${student.status}`;
    document.querySelectorAll(".status-btn").forEach((btn) => {
      btn.classList.toggle("selected", btn.dataset.status === student.status);
    });
  }

  async function loadMe() {
    try {
      const res = await fetch("/api/me");
      if (res.ok) {
        const student = await res.json();
        showStatusView(student);
      } else {
        showNameForm();
      }
    } catch (e) {
      showNameForm();
    }
  }

  async function join() {
    const name = nameInput.value.trim();
    nameError.textContent = "";
    if (!name) {
      nameError.textContent = "Please enter your name.";
      return;
    }
    if (name.length > 50) {
      nameError.textContent = "Name must be 50 characters or fewer.";
      return;
    }
    joinBtn.disabled = true;
    try {
      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const data = await res.json();
      if (!res.ok) {
        nameError.textContent = data.error || "Something went wrong. Try again.";
        joinBtn.disabled = false;
        return;
      }
      showStatusView(data);
    } catch (e) {
      nameError.textContent = "Could not reach the server. Try again.";
    }
    joinBtn.disabled = false;
  }

  async function setStatus(status) {
    statusError.textContent = "";
    try {
      const res = await fetch("/api/status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status }),
      });
      if (res.status === 404) {
        // Our student record is gone (removed by admin, or server restarted).
        showNameForm();
        return;
      }
      const data = await res.json();
      if (!res.ok) {
        statusError.textContent = data.error || "Could not update status.";
        return;
      }
      render(data);
    } catch (e) {
      statusError.textContent = "Could not reach the server. Try again.";
    }
  }

  joinBtn.addEventListener("click", join);
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") join();
  });
  document.querySelectorAll(".status-btn").forEach((btn) => {
    btn.addEventListener("click", () => setStatus(btn.dataset.status));
  });

  loadMe();
</script>
